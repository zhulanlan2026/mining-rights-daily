[project]
name = "mining-rights-daily"
version = "0.1.0"
description = "MCP mining-rights daily agent: news, NI 43-101 PDFs, and reference prices."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pypdf>=6.21.2",
    "tzdata>=2026.6",
]

[project.scripts]
mining-news-mcp = "mining_rights_daily.servers.news:main"
mineral-pdf-mcp = "mining_rights_daily.servers.pdf:main"
lme-price-mcp = "mining_rights_daily.servers.price:main"
mining-daily-agent = "mining_rights_daily.agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
